<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#333"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#e53935"/>
    </marker>
  </defs>

  <rect width="700" height="400" fill="#fff"/>

  <rect x="20" y="20" width="110" height="30" rx="4" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="52" y="39" font-family="monospace" font-size="13" fill="#333">Browser</text>

  <rect x="155" y="20" width="130" height="30" rx="4" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="170" y="39" font-family="monospace" font-size="13" fill="#333">PostDetailPage</text>

  <rect x="320" y="20" width="110" height="30" rx="4" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="340" y="39" font-family="monospace" font-size="13" fill="#333">API Client</text>

  <rect x="465" y="20" width="100" height="30" rx="4" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="493" y="39" font-family="monospace" font-size="13" fill="#333">Backend</text>

  <rect x="590" y="20" width="90" height="30" rx="4" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="612" y="39" font-family="monospace" font-size="13" fill="#333">Store</text>

  <line x1="75" y1="55" x2="75" y2="370" stroke="#999" stroke-dasharray="4"/>
  <line x1="220" y1="55" x2="220" y2="370" stroke="#999" stroke-dasharray="4"/>
  <line x1="375" y1="55" x2="375" y2="370" stroke="#999" stroke-dasharray="4"/>
  <line x1="515" y1="55" x2="515" y2="370" stroke="#999" stroke-dasharray="4"/>
  <line x1="635" y1="55" x2="635" y2="370" stroke="#999" stroke-dasharray="4"/>

  <text x="92" y="92" font-family="monospace" font-size="12" fill="#333">click Save</text>
  <line x1="75" y1="95" x2="220" y2="95" stroke="#333" marker-end="url(#arrow)"/>

  <text x="250" y="122" font-family="monospace" font-size="12" fill="#333">updatePost(id, {title, content})</text>
  <line x1="220" y1="125" x2="375" y2="125" stroke="#333" marker-end="url(#arrow)"/>

  <text x="400" y="152" font-family="monospace" font-size="12" fill="#333">PUT /api/posts/{id}</text>
  <line x1="375" y1="155" x2="515" y2="155" stroke="#333" marker-end="url(#arrow)"/>

  <text x="547" y="182" font-family="monospace" font-size="12" fill="#333">update_post(...)</text>
  <line x1="515" y1="185" x2="635" y2="185" stroke="#333" marker-end="url(#arrow)"/>

  <text x="547" y="212" font-family="monospace" font-size="12" fill="#333">updated Post</text>
  <line x1="635" y1="215" x2="515" y2="215" stroke="#333" marker-end="url(#arrow)"/>

  <text x="410" y="242" font-family="monospace" font-size="12" fill="#333">200 OK + Post</text>
  <line x1="515" y1="245" x2="375" y2="245" stroke="#333" marker-end="url(#arrow)"/>

  <text x="230" y="272" font-family="monospace" font-size="12" fill="#333">resolve updated Post</text>
  <line x1="375" y1="275" x2="220" y2="275" stroke="#333" marker-end="url(#arrow)"/>

  <text x="228" y="302" font-family="monospace" font-size="12" fill="#333">setPost(response), exit edit mode</text>
  <line x1="220" y1="305" x2="75" y2="305" stroke="#333" marker-end="url(#arrow)"/>

  <text x="405" y="335" font-family="monospace" font-size="12" fill="#e53935">error: non-200 -&gt; throw Error</text>
  <line x1="515" y1="338" x2="220" y2="338" stroke="#e53935" stroke-dasharray="5" marker-end="url(#arrowRed)"/>

  <text x="228" y="358" font-family="monospace" font-size="12" fill="#e53935">show "Failed to update post."</text>
</svg>
