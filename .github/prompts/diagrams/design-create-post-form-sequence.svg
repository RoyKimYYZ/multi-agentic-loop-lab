<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" font-family="monospace" font-size="12" fill="#333">
  <!-- Background -->
  <rect width="700" height="420" fill="#fff"/>

  <!-- Title -->
  <text x="350" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Sequence Diagram — Submit New Post</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
    <marker id="arrow-err" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#e53935"/>
    </marker>
    <marker id="arrow-ret" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

  <!-- Actor columns: x = 60, 190, 340, 490, 630 -->

  <!-- Actor boxes -->
  <rect x="20"  y="34" width="90" height="30" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
  <text x="65"  y="54" text-anchor="middle" font-weight="bold">User</text>

  <rect x="150" y="34" width="90" height="30" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
  <text x="195" y="54" text-anchor="middle" font-weight="bold">HomePage</text>

  <rect x="300" y="34" width="90" height="30" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
  <text x="345" y="54" text-anchor="middle" font-weight="bold">posts.ts</text>

  <rect x="450" y="34" width="90" height="30" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
  <text x="495" y="54" text-anchor="middle" font-weight="bold">Backend</text>

  <rect x="600" y="34" width="90" height="30" fill="#e3f2fd" stroke="#1976d2" rx="4"/>
  <text x="645" y="54" text-anchor="middle" font-weight="bold">Store</text>

  <!-- Lifelines -->
  <line x1="65"  y1="64" x2="65"  y2="400" stroke="#ccc" stroke-dasharray="4"/>
  <line x1="195" y1="64" x2="195" y2="400" stroke="#ccc" stroke-dasharray="4"/>
  <line x1="345" y1="64" x2="345" y2="400" stroke="#ccc" stroke-dasharray="4"/>
  <line x1="495" y1="64" x2="495" y2="400" stroke="#ccc" stroke-dasharray="4"/>
  <line x1="645" y1="64" x2="645" y2="400" stroke="#ccc" stroke-dasharray="4"/>

  <!-- Step 1: User submits form -->
  <line x1="65" y1="100" x2="190" y2="100" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="96" text-anchor="middle" font-size="11">submit form</text>

  <!-- Step 2: handleSubmit sets submitting=true -->
  <rect x="180" y="108" width="28" height="16" fill="#bbdefb" stroke="#1976d2" rx="2"/>
  <text x="194" y="120" text-anchor="middle" font-size="10">busy</text>
  <text x="220" y="120" font-size="10" fill="#555">setSubmitting(true)</text>

  <!-- Step 3: createPost called -->
  <line x1="195" y1="140" x2="340" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="265" y="136" text-anchor="middle" font-size="11">createPost(data)</text>

  <!-- Step 4: fetch POST /api/posts/ -->
  <line x1="345" y1="160" x2="490" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="156" text-anchor="middle" font-size="11">POST /api/posts/</text>

  <!-- Step 5: backend writes to store -->
  <line x1="495" y1="180" x2="640" y2="180" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="568" y="176" text-anchor="middle" font-size="11">_db[id] = post</text>

  <!-- Step 6: store returns -->
  <line x1="640" y1="200" x2="495" y2="200" stroke="#555" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow-ret)"/>
  <text x="568" y="196" text-anchor="middle" font-size="10" fill="#555">Post</text>

  <!-- Step 7: 201 response -->
  <line x1="490" y1="220" x2="345" y2="220" stroke="#555" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow-ret)"/>
  <text x="415" y="216" text-anchor="middle" font-size="10" fill="#555">201 Post</text>

  <!-- Step 8: createPost resolves -->
  <line x1="340" y1="240" x2="195" y2="240" stroke="#555" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow-ret)"/>
  <text x="265" y="236" text-anchor="middle" font-size="10" fill="#555">Post</text>

  <!-- Step 9: loadPosts called -->
  <line x1="195" y1="262" x2="340" y2="262" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="265" y="258" text-anchor="middle" font-size="11">listPosts()</text>

  <line x1="345" y1="278" x2="490" y2="278" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="415" y="274" text-anchor="middle" font-size="11">GET /api/posts/</text>

  <line x1="490" y1="294" x2="345" y2="294" stroke="#555" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow-ret)"/>
  <text x="415" y="290" text-anchor="middle" font-size="10" fill="#555">list[Post]</text>

  <line x1="340" y1="310" x2="195" y2="310" stroke="#555" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow-ret)"/>
  <text x="265" y="306" text-anchor="middle" font-size="10" fill="#555">posts[]</text>

  <!-- Step 10: setPosts + setSubmitting(false) -->
  <rect x="180" y="318" width="28" height="16" fill="#f5f5f5" stroke="#999" rx="2"/>
  <text x="194" y="330" text-anchor="middle" font-size="10">idle</text>
  <text x="220" y="330" font-size="10" fill="#555">setPosts() · setSubmitting(false)</text>

  <!-- Step 11: re-render -->
  <line x1="195" y1="350" x2="65" y2="350" stroke="#555" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow-ret)"/>
  <text x="128" y="346" text-anchor="middle" font-size="10" fill="#555">PostList re-renders</text>

  <!-- Error path note -->
  <text x="195" y="388" font-size="10" fill="#e53935">On error: setError("Failed to create post.") · setSubmitting(false)</text>
</svg>
