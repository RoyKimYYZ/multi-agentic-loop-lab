<svg xmlns="http://www.w3.org/2000/svg" width="600" height="530" font-family="monospace" font-size="13" fill="#333">

  <!-- Background -->
  <rect width="600" height="530" fill="#fff"/>

  <!-- Title -->
  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">UI Wireframe - Create Post Form</text>

  <!-- Header (unchanged) -->
  <rect x="20" y="36" width="560" height="44" fill="#f5f5f5" stroke="#999" rx="4"/>
  <text x="300" y="64" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">Blog</text>
  <text x="20" y="92" font-size="10" fill="#999">[unchanged]</text>

  <!-- PostForm (new) -->
  <rect x="20" y="100" width="560" height="210" fill="#e8f4fd" stroke="#2196f3" rx="4" stroke-width="1.5"/>
  <text x="32" y="120" font-size="11" font-weight="bold" fill="#1565c0">PostForm  [NEW]</text>

  <!-- Title input -->
  <text x="32" y="142" fill="#555">Title</text>
  <rect x="32" y="148" width="536" height="28" fill="#fff" stroke="#999" rx="3"/>
  <text x="42" y="167" fill="#bbb">Title</text>

  <!-- Content textarea -->
  <text x="32" y="192" fill="#555">Content</text>
  <rect x="32" y="198" width="536" height="48" fill="#fff" stroke="#999" rx="3"/>
  <text x="42" y="222" fill="#bbb">Content</text>

  <!-- Author input -->
  <text x="32" y="262" fill="#555">Author</text>
  <rect x="32" y="268" width="536" height="28" fill="#fff" stroke="#999" rx="3"/>
  <text x="42" y="287" fill="#bbb">Author</text>

  <!-- Submit button -->
  <rect x="32" y="300" width="80" height="28" fill="#1976d2" rx="4"/>
  <text x="72" y="319" text-anchor="middle" fill="#fff" font-weight="bold">Submit</text>
  <text x="122" y="319" fill="#999" font-size="11">disabled while submitting</text>

  <!-- Error state (conditional) -->
  <rect x="20" y="322" width="560" height="24" fill="#fff3e0" stroke="#ff9800" rx="3"/>
  <text x="32" y="339" fill="#e65100" font-size="11">Failed to create post.   [only shown on error]</text>

  <!-- PostList (unchanged) -->
  <rect x="20" y="358" width="560" height="118" fill="#f5f5f5" stroke="#999" rx="4"/>
  <text x="32" y="378" font-size="11" font-weight="bold" fill="#555">PostList  [unchanged]</text>

  <rect x="32" y="386" width="536" height="30" fill="#fff" stroke="#ddd" rx="3"/>
  <text x="44" y="406" fill="#1976d2">Hello, Parallel Agents!</text>
  <text x="400" y="406" fill="#999" font-size="11">by coach</text>

  <rect x="32" y="422" width="536" height="30" fill="#fff" stroke="#ddd" rx="3"/>
  <text x="44" y="442" fill="#1976d2">New post title (appears after submit)</text>
  <text x="400" y="442" fill="#999" font-size="11">by author</text>

  <!-- Legend -->
  <rect x="20" y="492" width="14" height="14" fill="#e8f4fd" stroke="#2196f3"/>
  <text x="40" y="503" font-size="11" fill="#555">New / changed</text>
  <rect x="150" y="492" width="14" height="14" fill="#f5f5f5" stroke="#999"/>
  <text x="170" y="503" font-size="11" fill="#555">Unchanged</text>
  <rect x="270" y="492" width="14" height="14" fill="#fff3e0" stroke="#ff9800"/>
  <text x="290" y="503" font-size="11" fill="#555">Conditional / error</text>

</svg>
