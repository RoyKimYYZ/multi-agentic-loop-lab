<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <rect width="600" height="500" fill="#fff"/>
  <text x="20" y="28" font-family="monospace" font-size="13" fill="#333">Post detail page - edit mode</text>

  <rect x="20" y="45" width="560" height="50" rx="4" fill="#f5f5f5" stroke="#999"/>
  <text x="35" y="75" font-family="monospace" font-size="13" fill="#333">Header: Blog</text>

  <rect x="20" y="110" width="560" height="320" rx="4" fill="#f5f5f5" stroke="#ccc"/>
  <text x="35" y="135" font-family="monospace" font-size="13" fill="#333">&larr; Back to posts</text>

  <rect x="35" y="150" width="530" height="240" rx="4" fill="#e8f4fd" stroke="#2196f3"/>
  <text x="50" y="172" font-family="monospace" font-size="13" fill="#333">EditPostForm (new)</text>

  <text x="50" y="198" font-family="monospace" font-size="13" fill="#333">Title</text>
  <rect x="50" y="205" width="500" height="32" rx="3" fill="#fff" stroke="#999"/>

  <text x="50" y="260" font-family="monospace" font-size="13" fill="#333">Content</text>
  <rect x="50" y="267" width="500" height="90" rx="3" fill="#fff" stroke="#999"/>

  <text x="50" y="377" font-family="monospace" font-size="13" fill="#333">by author-name   2026-01-01T00:00:00Z</text>

  <rect x="50" y="392" width="80" height="28" rx="4" fill="#1976d2"/>
  <text x="76" y="410" font-family="monospace" font-size="13" fill="#fff">Save</text>

  <rect x="145" y="392" width="80" height="28" rx="4" fill="#1976d2"/>
  <text x="162" y="410" font-family="monospace" font-size="13" fill="#fff">Cancel</text>

  <rect x="20" y="442" width="560" height="40" rx="4" fill="#fff" stroke="#ccc"/>
  <rect x="35" y="454" width="18" height="12" fill="#e8f4fd" stroke="#2196f3"/>
  <text x="60" y="464" font-family="monospace" font-size="13" fill="#333">blue = new/changed</text>
  <rect x="240" y="454" width="18" height="12" fill="#f5f5f5" stroke="#999"/>
  <text x="265" y="464" font-family="monospace" font-size="13" fill="#333">grey = unchanged</text>
</svg>
